<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="360" viewBox="0 0 300 360" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">
<defs>
  <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
    <path d="M1,1 L7,4.5 L1,8" fill="none" stroke="#5d9239" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="barRed" markerWidth="3" markerHeight="16" refX="1.5" refY="8" orient="auto">
    <line x1="1.5" y1="1" x2="1.5" y2="15" stroke="#e53e3e" stroke-width="2.6" stroke-linecap="round"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="white" rx="10"/>

<!-- Growth signals -->
<rect x="80" y="14" width="140" height="30" rx="15" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
<text x="150" y="33" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4b5563">Growth signals</text>

<line x1="150" y1="46" x2="150" y2="64" stroke="#5d9239" stroke-width="1.8" marker-end="url(#arrowGreen)"/>

<!-- Kinases -->
<rect x="65" y="68" width="170" height="30" rx="15" fill="#f0fdf4" stroke="#a7d28f" stroke-width="1.2"/>
<text x="150" y="87" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4c782e">PI3K / AKT / ERK</text>

<line x1="150" y1="100" x2="150" y2="120" stroke="#e53e3e" stroke-width="1.8" marker-end="url(#barRed)"/>
<text x="160" y="113" font-size="8.5" fill="#e53e3e">inhibits</text>

<!-- TSC complex -->
<rect x="52" y="126" width="196" height="70" rx="12" fill="#fbfdf9" stroke="#6ba544" stroke-width="1.6"/>
<rect x="64" y="137" width="82" height="30" rx="15" fill="#4c782e"/>
<text x="105" y="157" text-anchor="middle" font-size="14.5" font-weight="700" fill="white" font-style="italic">TSC1</text>
<rect x="154" y="137" width="82" height="30" rx="15" fill="#4c782e"/>
<text x="195" y="157" text-anchor="middle" font-size="14.5" font-weight="700" fill="white" font-style="italic">TSC2</text>
<line x1="146" y1="152" x2="154" y2="152" stroke="#4c782e" stroke-width="3"/>
<text x="150" y="185" text-anchor="middle" font-size="9" fill="#9ca3af">TSC complex · one functional unit</text>

<line x1="150" y1="200" x2="150" y2="220" stroke="#e53e3e" stroke-width="1.8" marker-end="url(#barRed)"/>
<text x="160" y="213" font-size="8.5" fill="#e53e3e">inhibits</text>

<!-- RHEB -->
<rect x="103" y="226" width="94" height="28" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.2"/>
<text x="150" y="244" text-anchor="middle" font-size="12.5" font-weight="600" fill="#3730a3" font-style="italic">RHEB</text>

<line x1="150" y1="256" x2="150" y2="276" stroke="#5d9239" stroke-width="1.8" marker-end="url(#arrowGreen)"/>

<!-- mTORC1 -->
<rect x="88" y="280" width="124" height="30" rx="15" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
<text x="150" y="299" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">mTORC1</text>

<line x1="150" y1="312" x2="150" y2="330" stroke="#5d9239" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
<text x="150" y="348" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4c782e">Cell growth &amp; proliferation</text>
</svg>
